<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ห้องลองชุด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500&family=IBM+Plex+Sans+Thai:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Boutique fitting room: one white sheet on a soft taupe wash, live mirror left, garments right; stacks on phones. */
:root{
  --wash:#8F8586; --wash2:#6E5F68; --sheet:#FFFFFF; --ink:#1A0F10; --muted:#7A7072; --line:#E6E1DF; --tile:#EEEDEB;
  --stage:#1B1B1B; --warn:#A4441C;
  --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Anuphan",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
html{background:var(--wash2)}
body{font-family:var(--body);font-size:15px;line-height:1.5;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,var(--wash) 0%,var(--wash2) 100%) fixed;
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
img{max-width:100%;display:block}

/* top bar */
.top{display:flex;align-items:center;gap:14px;max-width:1120px;margin:0 auto;padding-block:16px;color:#FFFFFF}
.brand{font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.04em;color:#FFFFFF;text-decoration:none}
.mode{font-size:12px;letter-spacing:.08em;opacity:.75;margin-right:auto}
.bag{border:1px solid rgba(255,255,255,.55);background:transparent;color:#FFFFFF;border-radius:999px;padding:7px 16px;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.bag span{font-family:var(--mono);font-size:12px}

/* sheet */
.sheet{max-width:1120px;margin:0 auto;background:var(--sheet);border-radius:28px;padding:28px 28px 32px;display:grid;gap:22px;box-shadow:0 30px 80px rgba(30,10,20,.25)}
@media (max-width:640px){.sheet{padding:22px 18px 24px;border-radius:24px}}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:8px;height:8px;border-radius:999px;background:#D9D4D3;transition:width .25s}
.dots i.on{width:36px;background:var(--ink)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.2vw,42px);line-height:1.15;letter-spacing:-.01em;margin:14px 0 0;text-wrap:balance}

.sheet-body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.sheet-body{grid-template-columns:minmax(0,1fr);gap:18px}}

/* stage */
.stage{position:relative;background:var(--stage);border-radius:20px;overflow:hidden;aspect-ratio:3/4;max-height:78vh;width:100%;max-width:100%}
body.store .stage{aspect-ratio:auto;height:calc(100vh - 230px)}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
body.mirrored .stage video{transform:scaleX(-1)}
.gate{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:22px;text-align:center;padding:24px}
.camicon{width:72px;height:72px;border-radius:50%;border:1px solid #5B5657;color:#B9B3B4;display:grid;place-items:center}
.gate p{margin:0;color:#8F898A;font-size:13px;max-width:28ch}
.idle{position:absolute;inset:0;display:grid;place-content:end start;padding:32px;background:linear-gradient(to top,rgba(0,0,0,.6),rgba(0,0,0,0) 60%);color:#FFFFFF}
.idle-k{margin:0;font-size:12px;letter-spacing:.2em;opacity:.8}
.idle-t{margin:6px 0 0;font-family:var(--display);font-weight:300;font-size:clamp(30px,5vw,52px);line-height:1.1}
.status{position:absolute;left:14px;top:14px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;padding:6px 12px;border-radius:999px}
.status i{width:7px;height:7px;border-radius:50%;background:#B4AEAF}
.status.live i{background:#2E9E62}
.flip{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--ink);display:grid;place-items:center}
body.store .flip{display:none}

/* rail */
.rail{display:grid;gap:18px;min-width:0}
.tip{margin:0;display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:12px 20px;font-size:14px;line-height:1.4}
.tip span{font-size:15px}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:860px){.strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;margin-inline:-2px}.pcard{flex:0 0 30%;scroll-snap-align:start}}
@media (max-width:480px){.pcard{flex-basis:42%}}
.pcard{border:1px solid transparent;background:none;padding:0;text-align:left;display:grid;gap:8px}
.pcard img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--tile);border-radius:14px;padding:10px;border:1px solid var(--line);transition:box-shadow .2s,transform .2s;mix-blend-mode:multiply}
.pcard.on img{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 10px 24px rgba(26,15,16,.12)}
@media (hover:hover){.pcard:hover img{transform:translateY(-2px)}}
.pcard span{font-size:13px;line-height:1.35}
.pcard b{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted)}

.selected{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:16px}
.selinfo{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.selinfo .nm{font-family:var(--display);font-size:20px;font-weight:400}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-size:20px}
.sizes{display:flex;gap:8px}
.sizes button{flex:1;height:42px;border:1px solid var(--line);background:none;border-radius:999px;font-family:var(--mono);font-size:13px}
.sizes button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.pill,.btn{border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;padding:14px 26px;font-size:15px;font-weight:500}
.pill.dark,.btn{background:var(--ink);color:#FFFFFF}
.pill.dark{background:#FFFFFF;color:#1A0F10;border-color:#FFFFFF;min-width:220px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.45}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#FFFFFF;padding:11px 20px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}

/* bag drawer */
.scrim{position:fixed;inset:0;background:rgba(20,10,14,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--sheet);z-index:21;display:flex;flex-direction:column;
  padding:calc(22px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 22px}
@media (min-width:600px){.drawer{top:12px;right:12px;bottom:12px;border-radius:24px}}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dh h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center}
.dbody{flex:1;overflow:auto;display:grid;align-content:start;gap:14px;min-height:0}
.dfoot{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.ci{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ci img{width:64px;height:80px;object-fit:contain;background:var(--tile);border-radius:10px;padding:4px}
.cinfo{min-width:0}.cinfo .nm{font-size:14px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.qty button{border:0;background:none;width:32px;height:32px}
.qty span{font-family:var(--mono);min-width:18px;text-align:center;font-size:13px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tag,.note{font-size:12px;color:var(--muted)}
.note{margin:0}
form.co{display:grid;gap:14px}
fieldset{border:0;padding:0;margin:0;display:grid;gap:8px}
legend{font-size:12px;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line)}
.opt:has(input:checked){border-color:var(--ink)}
.opt input{accent-color:#1A0F10}
.opt small{display:block;color:var(--muted);font-size:12px}
label.f{display:grid;gap:6px;font-size:12px;color:var(--muted)}
label.f input,label.f textarea,label.f select{font:inherit;font-size:15px;color:var(--ink);background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:12px}
.err{color:var(--warn);font-size:13px}
.done{text-align:center;display:grid;gap:12px;padding-block:28px}
.done .code{font-family:var(--mono);font-size:30px;letter-spacing:.1em}
.done p{margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.keybox{display:grid;gap:10px;width:min(340px,100%)}
.keybox input{font:inherit;font-size:14px;background:#262626;border:1px solid #4A4646;color:#F2EEEE;border-radius:999px;padding:13px 18px;text-align:center}
.keybox a{color:#B9B3B4;font-size:12px}
.meter{position:absolute;right:14px;bottom:14px;background:rgba(255,255,255,.92);color:var(--ink);font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px}
.stopbtn{position:absolute;left:14px;bottom:14px;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;padding:7px 14px;border-radius:999px}
.loading{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;color:#FFFFFF;background:rgba(0,0,0,.35);text-align:center;padding:24px}
.spin{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#FFFFFF;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.addtile{border:1px dashed #CFC8C6;border-radius:14px;background:none;aspect-ratio:3/4;display:grid;place-content:center;gap:6px;color:var(--muted);font-size:13px;text-align:center;padding:8px}
.addtile b{font-size:26px;font-weight:300;color:var(--ink)}
.addform{display:grid;gap:10px;border:1px solid var(--line);border-radius:18px;padding:14px}
.addform .row{display:flex;gap:8px;flex-wrap:wrap}.addform .row>*{flex:1 1 140px;min-width:0}
.addform img{width:72px;height:96px;object-fit:contain;background:var(--tile);border-radius:10px}
@media (max-width:520px){.mode{display:none}.brand{margin-right:auto;white-space:nowrap}}.modeswitch a{white-space:nowrap}.modeswitch{display:flex;gap:6px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}.modeswitch a{color:#FFFFFF;text-decoration:none;font-size:12px;padding:6px 12px;border-radius:999px;opacity:.8}.modeswitch a.on{background:#FFFFFF;color:#1A0F10;opacity:1}</style>
</head>
<body>
<header class="top">
  <span class="brand">ห้องลองชุด</span>
  <span class="mode" id="modeTxt">ลองที่บ้าน</span>
  <button class="bag" id="openCart">ตะกร้า <span id="cartN">0</span></button>
</header>

<main class="sheet">
  <div class="sheet-head">
    <div class="dots" aria-hidden="true"><i id="d1" class="on"></i><i id="d2"></i><i id="d3"></i></div>
    <h1 id="stepTitle">เปิดกล้องของคุณ</h1>
  </div>
  <div class="sheet-body">
    <section class="stage" id="stage">
      <video id="cam" playsinline muted autoplay></video>
      <video id="out" playsinline autoplay muted hidden></video>
      <div class="gate" id="gate">
        <div class="camicon" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M3.5 8.5h3.2l1.8-2.5h7l1.8 2.5h3.2v10.5h-17z"/><circle cx="12" cy="13.3" r="3.4"/></svg></div>
        <div class="keybox" id="keybox">
          <input id="apikey" type="password" placeholder="วาง Decart API key" autocomplete="off" spellcheck="false">
          <a href="https://platform.decart.ai" target="_blank" rel="noopener" id="keyLink">ขอ API key ได้ที่ platform.decart.ai</a>
        </div>
        <button class="pill dark" id="startBtn">เปิดกล้อง</button>
        <p id="gateMsg">ภาพจากกล้องส่งให้ AI ของ Decart เพื่อสร้างภาพลองชุดเท่านั้น</p>
      </div>
      <div class="loading" id="loading" hidden><div class="spin"></div><span id="loadTxt">กำลังเชื่อมต่อ AI</span></div>
      <div id="liveUI" hidden>
        <div class="status" id="status"><i></i><span id="statusTxt">กำลังเชื่อมต่อ</span></div>
        <button class="flip" id="flip" aria-label="สลับกล้อง"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 15a8 8 0 0 1-14 3l-2-2M20 4v4h-4M4 20v-4h4"/></svg></button>
        <button class="stopbtn" id="stop">หยุด</button>
        <div class="meter" id="meter">0:00 · ฿0</div>
      </div>
    </section>

    <aside class="rail">
      <p class="tip"><span aria-hidden="true">✦</span>ถอดเสื้อคลุมหนาออก และถอยให้กล้องเห็นถึงเอว (ถ้าลองกางเกงให้เห็นถึงเท้า)</p>
      <div class="strip" id="strip"></div>
      <div class="addform" id="addform" hidden>
        <div class="row" style="align-items:center"><img id="addPrev" alt=""><div style="display:grid;gap:8px">
          <label class="f">ชื่อสินค้า<input id="addName" placeholder="เช่น ยีนส์ทรงกระบอก"></label>
          <label class="f">ราคา (บาท)<input id="addPrice" inputmode="numeric" placeholder="590"></label></div></div>
        <label class="f">ประเภท<select id="addCat"><option value="top">เสื้อ</option><option value="bottom">กางเกง / กระโปรง</option><option value="outer">เสื้อคลุม</option><option value="dress">ชุดเดรส</option></select></label>
        <label class="f">อธิบายสั้นๆ (ภาษาอังกฤษช่วยให้แม่นขึ้น ไม่ใส่ก็ได้)<input id="addDesc" placeholder="e.g. light blue wide-leg denim jeans"></label>
        <div class="actions"><button class="btn ghost" id="addCancel">ยกเลิก</button><button class="btn" id="addOk">เพิ่มแล้วลองเลย</button></div>
        <div class="err" id="addErr" hidden></div>
      </div>
      <input type="file" id="addFile" accept="image/*" hidden>
      <div class="selected" id="selected" hidden></div>
    </aside>
  </div>
</main>

<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="ตะกร้าสินค้า">
  <div class="dh"><h2 id="dTitle">ตะกร้า</h2><button class="x" id="closeCart" aria-label="ปิด"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</aside>

const $ = (id) => document.getElementById(id);
const baht = (n) => "฿" + Math.round(n).toLocaleString("th-TH");

const st = {
  mode: location.hash === "#store" ? "store" : "home",
  products: [{ id: "dino", name: "เสื้อยืดลายไดโนพาร์ค", price: 350, cat: "top", image: DINO, sizes: ["S", "M", "L", "XL"],
    prompt: "Substitute the current top with a green short-sleeve crew-neck t-shirt with light green sunburst rays, a large cartoon blue brontosaurus print on the front and a red-orange Thai text logo across the chest" }],
  current: null, size: "M", cart: [], stream: null, rt: null, facing: "user", startedAt: 0, view: "cart", blobs: new Map(),
};
st.current = st.products[0];
try { $("apikey").value = localStorage.getItem("decartKey") || ""; } catch {}
if ($("apikey").value) $("keyLink").textContent = "ใช้ key ที่บันทึกไว้ · แก้ได้ในช่องด้านบน";

function step(n, title) { ["d1", "d2", "d3"].forEach((d, i) => $(d).classList.toggle("on", i === n - 1)); $("stepTitle").textContent = title; }
function status(t, live) { $("statusTxt").textContent = t; $("status").classList.toggle("live", !!live); }
function toast(t) { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 2400); }

/* ---------- camera + realtime AI ---------- */
let sdk = null;
async function start() {
  const key = $("apikey").value.trim();
  if (!key) { $("gateMsg").textContent = "วาง API key ของ Decart ก่อน"; return; }
  try { localStorage.setItem("decartKey", key); } catch {}
  $("gateMsg").textContent = "";
  try {
    st.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: st.facing }, audio: false });
  } catch {
    $("gateMsg").textContent = location.protocol === "https:" || location.hostname === "localhost"
      ? "เปิดกล้องไม่ได้ กดอนุญาตการใช้กล้องในเบราว์เซอร์แล้วลองอีกครั้ง"
      : "กล้องใช้ได้เฉพาะเว็บที่เป็น https เท่านั้น อัปโหลดไฟล์นี้ขึ้นเว็บก่อน";
    return;
  }
  const cam = $("cam"); cam.srcObject = st.stream; await cam.play().catch(() => {});
  document.body.classList.toggle("mirrored", st.facing === "user");
  $("gate").hidden = true; $("liveUI").hidden = false; $("loading").hidden = false; $("loadTxt").textContent = "กำลังเชื่อมต่อ AI";
  status("กำลังเชื่อมต่อ"); step(2, "แตะชุดเพื่อลองบนตัวคุณ");
  try {
    sdk = sdk || (await import(SDK_URL));
    const client = sdk.createDecartClient({ apiKey: key });
    st.rt = await client.realtime.connect(st.stream, {
      model: sdk.models.realtime(MODEL),
      onRemoteStream: (remote) => { const o = $("out"); o.srcObject = remote; o.hidden = false; o.play().catch(() => {}); $("loading").hidden = true; },
    });
    st.startedAt = Date.now(); tick();
    status("AI พร้อม", true);
    if (st.current) await tryOn(st.current);
  } catch (e) {
    console.error(e);
    stop(false);
    const m = String(e && (e.message || e));
    $("gateMsg").textContent = /401|403|auth|key|unauthor/i.test(m) ? "API key ไม่ถูกต้อง หรือเครดิตหมด ตรวจสอบที่ platform.decart.ai"
      : "เชื่อมต่อ AI ไม่สำเร็จ: " + m.slice(0, 160);
  }
}
function stop(showMsg = true) {
  try { st.rt?.disconnect?.(); } catch {}
  st.rt = null;
  st.stream?.getTracks().forEach((t) => t.stop()); st.stream = null;
  $("out").hidden = true; $("out").srcObject = null; $("cam").srcObject = null;
  $("liveUI").hidden = true; $("loading").hidden = true; $("gate").hidden = false;
  if (showMsg && st.startedAt) $("gateMsg").textContent = "หยุดแล้ว ใช้ไป " + fmtUse();
  st.startedAt = 0; step(1, "เปิดกล้องของคุณ");
}
function fmtUse() {
  const s = Math.floor((Date.now() - st.startedAt) / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")} · ${baht(s * USD_PER_SEC * THB_PER_USD)}`;
}
function tick() { if (!st.startedAt) return; $("meter").textContent = fmtUse(); setTimeout(tick, 1000); }
async function blobFor(p) {
  if (!st.blobs.has(p.id)) st.blobs.set(p.id, await fetch(p.image).then((r) => r.blob()));
  return st.blobs.get(p.id);
}
async function tryOn(p) {
  st.current = p; renderStrip(); renderSelected();
  if (!st.rt) return;
  status("กำลังเปลี่ยนชุด", true);
  try {
    await st.rt.set({ prompt: p.prompt, image: await blobFor(p), enhance: false });
    status("กำลังใส่ " + p.name, true);
  } catch (e) { console.error(e); status("เปลี่ยนชุดไม่สำเร็จ แตะอีกครั้ง", true); }
}

/* ---------- products ---------- */
function renderStrip() {
  const el = $("strip"); el.innerHTML = "";
  for (const p of st.products) {
    const b = document.createElement("button");
    b.className = "pcard" + (st.current?.id === p.id ? " on" : "");
    b.setAttribute("aria-pressed", st.current?.id === p.id);
    b.innerHTML = `<img src="${p.image}" alt=""><span>${esc(p.name)}</span><b>${baht(p.price)}</b>`;
    b.onclick = () => tryOn(p);
    el.appendChild(b);
  }
  const add = document.createElement("button");
  add.className = "pcard"; add.innerHTML = `<span class="addtile"><b>+</b>เพิ่มชุดจากรูป</span>`;
  add.onclick = () => $("addFile").click();
  el.appendChild(add);
}
let pending = null;
$("addFile").onchange = () => { const f = $("addFile").files[0]; if (!f) return; pending = URL.createObjectURL(f); $("addPrev").src = pending; $("addform").hidden = false; $("addErr").hidden = true; };
$("addCancel").onclick = () => { $("addform").hidden = true; $("addFile").value = ""; };
$("addOk").onclick = () => {
  const name = $("addName").value.trim(), price = parseInt($("addPrice").value, 10), cat = $("addCat").value, desc = $("addDesc").value.trim();
  if (!name || !(price > 0)) { $("addErr").textContent = "ใส่ชื่อและราคาให้ครบ"; $("addErr").hidden = false; return; }
  const t = TARGET[cat];
  const prompt = `Substitute the current ${t} with ${desc || "the " + (cat === "dress" ? "dress" : t) + " shown in the reference image"}, matching its exact color, pattern and fit`;
  const p = { id: "u" + Date.now(), name, price, cat, image: pending, sizes: ["S", "M", "L", "XL"], prompt };
  st.products.push(p); $("addform").hidden = true; $("addFile").value = "";
  ["addName", "addPrice", "addDesc"].forEach((i) => ($(i).value = ""));
  tryOn(p);
};
function renderSelected() {
  const p = st.current, el = $("selected"); if (!p) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<div class="selinfo"><div class="nm">${esc(p.name)}</div><div class="price">${baht(p.price)}</div></div>
    <div class="sizes">${p.sizes.map((z) => `<button data-z="${z}" aria-pressed="${z === st.size}">${z}</button>`).join("")}</div>
    <div class="actions"><button class="btn ghost" id="addCart">ใส่ตะกร้า</button><button class="btn" id="next">ไปต่อ →</button></div>`;
  el.querySelectorAll("[data-z]").forEach((b) => (b.onclick = () => { st.size = b.dataset.z; renderSelected(); }));
  const add = () => { const f = st.cart.find((c) => c.id === p.id && c.size === st.size); if (f) f.qty++; else st.cart.push({ id: p.id, size: st.size, qty: 1 }); $("cartN").textContent = cartCount(); };
  $("addCart").onclick = () => { add(); toast(`เพิ่ม ${p.name} ไซซ์ ${st.size} แล้ว`); };
  $("next").onclick = () => { if (!st.cart.some((c) => c.id === p.id)) add(); openDrawer("cart"); };
}
/* ---------- bag + checkout ---------- */
const byId = (id) => st.products.find((p) => p.id === id);
const cartCount = () => st.cart.reduce((s, c) => s + c.qty, 0);
const cartTotal = () => st.cart.reduce((s, c) => s + c.qty * byId(c.id).price, 0);
function openDrawer(v) { st.view = v; $("drawer").hidden = false; $("scrim").hidden = false; step(3, "ตะกร้าและชำระเงิน"); renderDrawer(); }
function closeDrawer() { $("drawer").hidden = true; $("scrim").hidden = true; if (st.view === "done") st.view = "cart"; st.rt ? step(2, "แตะชุดเพื่อลองบนตัวคุณ") : step(1, "เปิดกล้องของคุณ"); }
const dTH = (t) => new Date(t).toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short" });
function renderDrawer() {
  const body = $("dBody"), foot = $("dFoot"), store = st.mode === "store";
  if (st.view === "done") {
    const o = st.order; $("dTitle").textContent = "สั่งซื้อสำเร็จ";
    body.innerHTML = `<div class="done"><div class="eyebrow">หมายเลขคำสั่งซื้อ</div><div class="code">${o.no}</div>
      ${o.ship === "pickup" ? `<p>${store ? "แสดงหมายเลขนี้ที่เคาน์เตอร์ แล้วรับสินค้าได้ทันที" : "รับสินค้าที่" + esc(o.branch) + " ภายใน 2 ชั่วโมง"}</p>`
        : `<p>จัดส่งถึงหน้าบ้าน<br>คาดว่าได้รับ ${dTH(Date.now() + 2 * 864e5)} – ${dTH(Date.now() + 5 * 864e5)}</p>`}
      <p class="price big">${baht(o.total)}</p><p class="note">ชำระด้วย ${esc(o.pay)} · โหมดทดสอบ ยังไม่ตัดเงินจริง</p></div>`;
    foot.innerHTML = `<button class="btn" id="again">ลองชุดต่อ</button>`; $("again").onclick = closeDrawer; return;
  }
  if (st.view === "checkout") {
    $("dTitle").textContent = "ชำระเงิน";
    body.innerHTML = `<form id="co" class="co" novalidate>
      <fieldset><legend>รับสินค้า</legend>
        <label class="opt"><input type="radio" name="ship" value="pickup" ${store ? "checked" : ""}><span>${store ? "รับที่ร้านตอนนี้" : "รับที่ร้าน"}<small>${store ? "ชำระแล้วรับที่เคาน์เตอร์ได้ทันที" : "ไม่มีค่าส่ง"}</small></span></label>
        <label class="opt"><input type="radio" name="ship" value="delivery" ${store ? "" : "checked"}><span>จัดส่งถึงบ้าน · ฿50<small>ได้รับภายใน 2–5 วัน · ฟรีเมื่อซื้อครบ ฿1,500</small></span></label>
      </fieldset>
      <label class="f" id="brW">สาขา<select id="branch"><option>สาขาสยามสแควร์</option><option>สาขาเซ็นทรัลเวิลด์</option><option>สาขาเชียงใหม่ นิมมาน</option></select></label>
      <label class="f">ชื่อผู้รับ<input id="nm" autocomplete="name"></label>
      <label class="f">เบอร์โทร<input id="ph" inputmode="tel" autocomplete="tel"></label>
      <label class="f" id="adW">ที่อยู่จัดส่ง<textarea id="ad" rows="3" autocomplete="street-address"></textarea></label>
      <fieldset><legend>ชำระเงิน</legend>
        <label class="opt"><input type="radio" name="pay" value="พร้อมเพย์" checked><span>พร้อมเพย์ QR</span></label>
        <label class="opt"><input type="radio" name="pay" value="บัตรเครดิต/เดบิต"><span>บัตรเครดิต / เดบิต</span></label>
        <label class="opt" id="codW"><input type="radio" name="pay" value="เก็บเงินปลายทาง"><span>เก็บเงินปลายทาง</span></label>
      </fieldset><div class="err" id="err" hidden></div></form>`;
    const del = () => document.querySelector("input[name=ship]:checked").value === "delivery";
    const sync = () => {
      $("brW").hidden = del() || store; $("adW").hidden = !del(); $("codW").hidden = !del();
      const sub = cartTotal(), fee = del() && sub < 1500 ? 50 : 0;
      foot.innerHTML = `<div class="sum"><div><div class="tag">สินค้า ${baht(sub)}${fee ? " + ค่าส่ง ฿50" : ""}</div><div class="price big">${baht(sub + fee)}</div></div><button class="btn" id="place">ยืนยันสั่งซื้อ</button></div><button class="btn ghost" id="back">กลับไปตะกร้า</button>`;
      $("back").onclick = () => { st.view = "cart"; renderDrawer(); };
      $("place").onclick = () => $("co").requestSubmit();
    };
    document.querySelectorAll("input[name=ship]").forEach((i) => (i.onchange = sync)); sync();
    $("co").onsubmit = (e) => {
      e.preventDefault();
      const d = del(), nm = $("nm").value.trim(), ph = $("ph").value.replace(/\D/g, ""), ad = $("ad").value.trim();
      const msg = !nm ? "กรอกชื่อผู้รับ" : ph.length < 9 ? "กรอกเบอร์โทรให้ครบ" : d && ad.length < 10 ? "กรอกที่อยู่จัดส่งให้ครบ" : "";
      if (msg) { $("err").textContent = msg; $("err").hidden = false; return; }
      let pay = document.querySelector("input[name=pay]:checked").value; if (!d && pay === "เก็บเงินปลายทาง") pay = "พร้อมเพย์";
      const sub = cartTotal();
      st.order = { no: "LS" + String(Date.now()).slice(-6), ship: d ? "delivery" : "pickup", branch: $("branch").value, total: sub + (d && sub < 1500 ? 50 : 0), pay };
      st.cart = []; $("cartN").textContent = 0; st.view = "done"; renderDrawer();
    };
    return;
  }
  $("dTitle").textContent = "ตะกร้า";
  if (!st.cart.length) { body.innerHTML = `<p class="note">ยังไม่มีสินค้า แตะชุดแล้วกด "ใส่ตะกร้า"</p>`; foot.innerHTML = ""; return; }
  body.innerHTML = "";
  st.cart.forEach((c, i) => {
    const p = byId(c.id), r = document.createElement("div"); r.className = "ci";
    r.innerHTML = `<img src="${p.image}" alt=""><div class="cinfo"><div class="nm">${esc(p.name)}</div><div class="tag">ไซซ์ ${c.size}</div><div class="price">${baht(p.price * c.qty)}</div></div>
      <div class="qty"><button aria-label="ลด">−</button><span>${c.qty}</span><button aria-label="เพิ่ม">+</button></div>`;
    const [m, pl] = r.querySelectorAll(".qty button");
    m.onclick = () => { c.qty--; if (c.qty <= 0) st.cart.splice(i, 1); $("cartN").textContent = cartCount(); renderDrawer(); };
    pl.onclick = () => { c.qty++; $("cartN").textContent = cartCount(); renderDrawer(); };
    body.appendChild(r);
  });
  foot.innerHTML = `<div class="sum"><div><div class="tag">${cartCount()} ชิ้น</div><div class="price big">${baht(cartTotal())}</div></div><button class="btn" id="toCo">ชำระเงิน →</button></div>
    <p class="note">${store ? "ซื้อที่ร้าน: ชำระแล้วรับสินค้าได้ทันที" : "สั่งจากบ้าน: จัดส่งถึงหน้าบ้านภายใน 2–5 วัน"}</p>`;
  $("toCo").onclick = () => { st.view = "checkout"; renderDrawer(); };
}


/* ---------- boot ---------- */
$("startBtn").onclick = start;
$("stop").onclick = () => stop(true);
$("flip").onclick = () => { stop(false); st.facing = st.facing === "user" ? "environment" : "user"; start(); };
$("openCart").onclick = () => openDrawer("cart");
$("closeCart").onclick = closeDrawer; $("scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("drawer").hidden) closeDrawer(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && st.rt && st.mode === "home") stop(true); });
window.addEventListener("pagehide", () => stop(false));
document.body.classList.toggle("store", st.mode === "store");
$("modeTxt").textContent = st.mode === "store" ? "กระจกในร้าน" : "ลองที่บ้าน";
renderStrip(); renderSelected();
</script>
</body>
</html>
